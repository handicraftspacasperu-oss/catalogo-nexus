<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus Store | Catálogo de productos</title>
<meta name="description" content="Componentes, accesorios y suministros para portátiles, PC e impresoras. Cotiza por WhatsApp.">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

<style>
/* ==========================================================
   ESTILO VISUAL: cambia colores, fuentes y bordes desde aquí
   ========================================================== */
:root{
  --azul:#0a3a8f;            /* color principal (azul del logo) */
  --azul-oscuro:#062a6b;     /* azul profundo: tarjetas de grupo y pie de página */
  --celeste:#19c6e6;         /* color de acento (celeste del logo) */
  --celeste-claro:#e3f8fd;
  --tinta:#0e1b33;           /* color del texto principal */
  --texto-suave:#52627d;     /* texto secundario */
  --fondo:#f2f6fb;           /* fondo de la página */
  --blanco:#ffffff;
  --borde:#d9e3f0;
  --verde:#1a9d4f;           /* botón de WhatsApp */
  --verde-oscuro:#13803f;
  --fuente-titulos:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fuente-texto:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --radio:14px;              /* redondeo de las tarjetas */
  --ancho-max:1280px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--fuente-texto);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%}
:focus-visible{outline:3px solid var(--celeste);outline-offset:2px}
.wrap{max-width:var(--ancho-max);margin:0 auto;padding:0 24px}

/* Encabezado */
.top{position:sticky;top:0;z-index:20;background:var(--blanco);border-bottom:1px solid var(--borde)}
.top-in{display:flex;align-items:center;gap:24px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;border:0;background:none;padding:0}
.brand img{height:64px;width:auto;display:block}
.search{flex:1;position:relative;max-width:620px;margin:0 auto}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--texto-suave)}
.search input{width:100%;height:48px;border-radius:999px;border:1.5px solid var(--borde);background:var(--fondo);padding:0 20px 0 46px;font:inherit;color:var(--tinta)}
.search input:focus{outline:none;border-color:var(--azul);background:var(--blanco);box-shadow:0 0 0 4px var(--celeste-claro)}
.contacto{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--texto-suave);white-space:nowrap}
.contacto a{color:inherit;text-decoration:none}
.contacto strong{display:block;color:var(--azul);font-family:var(--fuente-titulos);font-size:15px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1.5px solid transparent;padding:10px 18px;font-weight:600;font-size:15px;text-decoration:none;transition:background .15s,color .15s,border-color .15s}
.btn svg{width:18px;height:18px;flex:none}
.btn.wa{background:var(--verde);color:#fff}
.btn.wa:hover{background:var(--verde-oscuro)}
.btn.ghost{border-color:var(--azul);color:var(--azul);background:transparent}
.btn.ghost:hover{background:var(--azul);color:#fff}
.btn.flat{background:var(--celeste-claro);color:var(--azul)}
.btn.flat:hover{background:var(--celeste);color:var(--azul-oscuro)}

/* Portada */
.hero{margin:24px 0 8px}
.hero img{display:block;width:100%;height:auto;border-radius:20px}
h1,h2,h3{font-family:var(--fuente-titulos);line-height:1.2;margin:0}
.titulo-seccion{font-size:28px;font-weight:700;margin:36px 0 18px;color:var(--azul-oscuro)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:190px;text-align:left;padding:24px;border:0;border-radius:20px;color:#fff;background:linear-gradient(150deg,var(--azul) 0%,var(--azul-oscuro) 100%);transition:transform .18s,box-shadow .18s}
.tile::after{content:"";position:absolute;right:-46px;bottom:-46px;width:140px;height:140px;border-radius:50%;border:18px solid rgba(25,198,230,.22)}
.tile:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(10,58,143,.28)}
.tile-emoji{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:var(--celeste);font-size:28px}
.tile-name{display:block;font-family:var(--fuente-titulos);font-weight:700;font-size:20px}
.tile-count{display:block;margin-top:4px;font-size:14px;color:#bfe9f5}
.tile.todo{background:var(--blanco);color:var(--azul);border:2px dashed var(--celeste)}
.tile.todo .tile-count{color:var(--texto-suave)}
.tile.todo::after{display:none}

/* Exploración */
.cabecera{padding:26px 0 18px}
.migas{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--texto-suave);margin-bottom:8px}
.migas button{border:0;background:none;padding:0;color:var(--azul);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.cabecera h1{font-size:32px;color:var(--azul-oscuro)}
.cabecera p{margin:6px 0 0;color:var(--texto-suave)}
.layout{display:grid;grid-template-columns:270px 1fr;gap:32px;align-items:start;padding-bottom:56px}
.filtros{position:sticky;top:98px;max-height:calc(100vh - 118px);overflow-y:auto;padding-right:6px}
.facet{margin-bottom:22px}
.facet h2{font-size:15px;font-weight:700;color:var(--azul-oscuro);margin:0 0 8px}
.facet-list{display:flex;flex-direction:column;gap:2px}
.facet:last-child .facet-list{max-height:340px;overflow-y:auto}
.chip{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 12px;border:0;border-radius:10px;background:transparent;font-size:15px}
.chip span{font-size:13px;color:var(--texto-suave)}
.chip:hover{background:var(--celeste-claro)}
.chip.on{background:var(--azul);color:#fff}
.chip.on span{color:#bfe9f5}
.limpiar{margin-top:4px}

.resumen{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;color:var(--texto-suave);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{display:flex;flex-direction:column;background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);overflow:hidden;transition:box-shadow .18s,border-color .18s}
.card:hover{border-color:var(--celeste);box-shadow:0 10px 26px rgba(10,58,143,.14)}
.card-img{display:block;width:100%;aspect-ratio:1/1;padding:12px;border:0;border-bottom:1px solid var(--borde);background:#fff}
.card-img img{width:100%;height:100%;object-fit:contain;display:block}
.card-body{display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--celeste-claro);color:var(--azul)}
.tag.marca{background:var(--azul);color:#fff}
.card h3{font-size:15.5px;font-weight:600;line-height:1.3}
.extracto{margin:0;font-size:14px;color:var(--texto-suave);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;padding-top:6px}
.acciones .btn{padding:9px 8px;font-size:14px}
.mas{display:flex;justify-content:center;margin-top:28px}
.estado{padding:60px 0;text-align:center;color:var(--texto-suave)}
.vacio{padding:48px 24px;text-align:center;background:var(--blanco);border:1px dashed var(--borde);border-radius:var(--radio)}
.vacio h3{font-size:20px;margin-bottom:8px}
.vacio p{margin:0 0 18px;color:var(--texto-suave)}

/* Ficha técnica */
dialog{border:0;border-radius:22px;padding:0;width:calc(100% - 32px);max-width:900px;max-height:90vh;color:var(--tinta);box-shadow:0 30px 80px rgba(6,42,107,.35)}
dialog::backdrop{background:rgba(6,26,60,.62)}
.ficha{display:grid;grid-template-columns:1fr 1.15fr}
.ficha-img{display:grid;place-items:center;padding:28px;background:#fff;border-right:1px solid var(--borde)}
.ficha-img img{width:100%;max-height:420px;object-fit:contain}
.ficha-info{padding:30px 30px 28px;display:flex;flex-direction:column;gap:14px}
.ficha-info h2{font-size:24px;color:var(--azul-oscuro);padding-right:36px}
.ficha-info h3{font-size:15px;color:var(--azul-oscuro)}
.ficha-info ul{margin:0;padding-left:20px;color:var(--tinta);font-size:15px}
.ficha-info li{margin-bottom:6px}
.ficha-info .btn.wa{margin-top:auto;padding:14px 20px;font-size:17px}
.cerrar{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:0;background:var(--fondo);font-size:22px;line-height:1;color:var(--azul-oscuro)}
.cerrar:hover{background:var(--celeste)}

/* Pie y botón flotante */
.pie{background:var(--azul-oscuro);color:#cfe3f5;padding:34px 0;margin-top:20px}
.pie-in{display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px;align-items:center}
.pie strong{font-family:var(--fuente-titulos);color:#fff;font-size:20px}
.pie a{color:var(--celeste);text-decoration:none}
.pie p{margin:4px 0 0;font-size:14px}
.flotante{position:fixed;right:22px;bottom:22px;z-index:30;display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--verde);color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.28)}
.flotante:hover{background:var(--verde-oscuro)}
.flotante svg{width:30px;height:30px}

@media (max-width:1100px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (max-width:900px){
  .top-in{flex-wrap:wrap;gap:10px}
  .brand img{height:52px}
  .search{order:3;flex-basis:100%;max-width:none}
  .contacto{margin-left:auto}
  .contacto .datos{display:none}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .layout{grid-template-columns:1fr;gap:8px}
  .filtros{position:static;max-height:none;overflow:visible;padding:0}
  .facet{margin-bottom:12px}
  .facet-list,.facet:last-child .facet-list{flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px;gap:8px}
  .chip{width:auto;white-space:nowrap;border:1px solid var(--borde);background:var(--blanco);border-radius:999px;flex:none}
  .ficha{grid-template-columns:1fr}
  .ficha-img{border-right:0;border-bottom:1px solid var(--borde);padding:18px}
  .ficha-img img{max-height:260px}
}
@media (max-width:520px){
  .wrap{padding:0 14px}
  .tiles{gap:12px}.tile{min-height:160px;padding:18px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .acciones{grid-template-columns:1fr}
  .cabecera h1{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<body>
<header class="top">
  <div class="wrap top-in">
    <button class="brand" id="btn-inicio" aria-label="Ir al inicio del catálogo"><img src="assets/logo.png" alt="Nexus Store, tecnología que te conecta"></button>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="buscar" type="search" placeholder="Busca por nombre, marca o característica" aria-label="Buscar productos" autocomplete="off">
    </div>
    <div class="contacto">
      <div class="datos"><strong id="tel"></strong><a id="correo"></a></div>
      <a class="btn wa" id="wa-cabecera" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg>Escríbenos</a>
    </div>
  </div>
</header>

<main class="wrap" id="main"><p class="estado">Cargando catálogo…</p></main>

<footer class="pie">
  <div class="wrap pie-in">
    <div><strong>Nexus Store</strong><p>Tecnología que te conecta</p></div>
    <div><p id="pie-tel"></p><p><a id="pie-correo"></a></p></div>
    <p>© <span id="anio"></span> Nexus Store</p>
  </div>
</footer>

<a class="flotante" id="wa-flotante" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg></a>

<dialog id="ficha" aria-label="Ficha técnica del producto"></dialog>

<script>
/* ==========================================================
   CONFIGURACIÓN: aquí editas los datos de la tienda
   ========================================================== */
const CONFIG = {
  // 1) Enlace CSV de tu Google Sheet publicado (Archivo > Compartir > Publicar en la web > CSV).
  //    Si lo dejas vacío, el catálogo se lee del archivo productos.csv de este mismo repositorio.
  CSV_URL: "",
  CSV_RESPALDO: "productos.csv",

  // 2) WhatsApp. El número va sin "+" ni espacios. Con él, el botón Cotizar envía el nombre del producto.
  WHATSAPP_NUMERO: "51991958746",
  WHATSAPP_LINK_GENERAL: "https://wa.link/pq6rji",   // botones generales (Escríbenos y botón flotante)
  MENSAJE_COTIZAR: "Hola Nexus Store, quisiera cotizar este producto: {producto} (marca {marca}, código {id}). Lo vi en su catálogo web.",

  // 3) Datos de contacto visibles
  TELEFONO: "+51 991 958 746",
  CORREO: "nexusstorev@gmail.com",

  // 4) Cómo se ve el catálogo
  PRODUCTOS_POR_PAGINA: 24,
  ORDEN_GRUPOS: ["Portátiles","Componentes de PC","Periféricos y accesorios","Almacenamiento","Impresión","Energía y protección","Seguridad"],
  EMOJI_GRUPOS: {"Portátiles":"💻","Componentes de PC":"🖥️","Periféricos y accesorios":"🖱️","Almacenamiento":"💾","Impresión":"🖨️","Energía y protección":"🔌","Seguridad":"📹"}
};

/* ==========================================================
   CÓDIGO DEL CATÁLOGO (no hace falta tocarlo)
   ========================================================== */
const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#f2f6fb"/><g fill="none" stroke="#9fb3cf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="50" y="60" width="100" height="70" rx="8"/><path d="M80 150h40M100 130v20"/></g></svg>');
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
const WA_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg>';

let PRODUCTS = [];
const state = { grupo: null, todo: false, todoAuto: false, q: '', cat: null, marca: null, mostrados: CONFIG.PRODUCTOS_POR_PAGINA };

/* ---- Lectura del CSV (acepta comillas y saltos de línea dentro de una celda) ---- */
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (c !== '\r') field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

const ALIAS = {
  id: ['id', 'codigo'], item: ['item', 'orden'],
  nombre: ['nombre producto', 'nombre comercial', 'nombre', 'producto'],
  grupo: ['grupo'], categoria: ['categoria'], emoji: ['emoji'], marca: ['marca'],
  car: ['caracteristicas', 'descripcion'], img: ['imagen', 'foto'], visible: ['visible']
};

/* Acepta rutas (img/p001.png), enlaces https y enlaces de Google Drive compartidos */
function urlImagen(v) {
  v = (v || '').trim();
  if (!v) return PLACEHOLDER;
  const d = v.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
  if (d) return 'https://drive.google.com/thumbnail?id=' + d[1] + '&sz=w800';
  return v;
}

function aProductos(rows) {
  const head = rows[0].map(norm), idx = {};
  for (const k in ALIAS) idx[k] = head.findIndex(h => ALIAS[k].includes(h));
  const out = [];
  rows.slice(1).forEach((r, n) => {
    const g = k => idx[k] >= 0 ? (r[idx[k]] || '').trim() : '';
    if (!g('nombre')) return;
    if (['no', 'n', '0', 'false', 'oculto'].includes(norm(g('visible')))) return;
    const p = {
      n, id: g('id') || String(n + 1), item: parseFloat(g('item')) || 9999,
      nombre: g('nombre'), grupo: g('grupo') || 'Otros', categoria: g('categoria') || 'Otros',
      emoji: g('emoji') || '📦', marca: g('marca') || 'Sin marca', car: g('car'), img: urlImagen(g('img'))
    };
    p.hay = norm([p.nombre, p.marca, p.categoria, p.grupo, p.car].join(' '));
    out.push(p);
  });
  const orden = {}; out.forEach(p => { if (!(p.categoria in orden)) orden[p.categoria] = Object.keys(orden).length; });
  out.sort((a, b) => orden[a.categoria] - orden[b.categoria] || a.item - b.item || a.n - b.n);
  return out;
}

async function cargar() {
  const intentos = [CONFIG.CSV_URL, CONFIG.CSV_RESPALDO].filter(Boolean);
  for (const url of intentos) {
    try {
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const prods = aProductos(parseCSV(await r.text()));
      if (prods.length) { PRODUCTS = prods; return true; }
    } catch (e) { console.warn('No se pudo leer', url, e); }
  }
  return false;
}

/* ---- Utilidades de vista ---- */
const waProducto = p => 'https://wa.me/' + CONFIG.WHATSAPP_NUMERO + '?text=' + encodeURIComponent(
  CONFIG.MENSAJE_COTIZAR.replace('{producto}', p.nombre).replace('{marca}', p.marca).replace('{id}', p.id).replace('{categoria}', p.categoria));
const lineas = p => p.car.split('\n').map(s => s.trim()).filter(Boolean);
const extracto = p => { const t = lineas(p).join(' '); return t.length > 150 ? t.slice(0, 147).trim() + '…' : t; };
const contar = (lista, clave) => { const m = new Map(); lista.forEach(p => m.set(p[clave], (m.get(p[clave]) || 0) + 1)); return m; };
const emojiGrupo = g => CONFIG.EMOJI_GRUPOS[g] || (PRODUCTS.find(p => p.grupo === g) || {}).emoji || '📦';
function gruposOrdenados() {
  const todos = [...new Set(PRODUCTS.map(p => p.grupo))];
  const o = CONFIG.ORDEN_GRUPOS;
  return todos.sort((a, b) => (o.indexOf(a) < 0 ? 99 : o.indexOf(a)) - (o.indexOf(b) < 0 ? 99 : o.indexOf(b)));
}
const plural = (n, s, p) => n + ' ' + (n === 1 ? s : p);

/* ---- Portada ---- */
function verPortada(main) {
  const tiles = gruposOrdenados().map(g => {
    const lista = PRODUCTS.filter(p => p.grupo === g);
    const nCat = new Set(lista.map(p => p.categoria)).size;
    return `<button class="tile" data-grupo="${esc(g)}"><span class="tile-emoji">${esc(emojiGrupo(g))}</span>
      <span><span class="tile-name">${esc(g)}</span><span class="tile-count">${plural(lista.length, 'producto', 'productos')} en ${plural(nCat, 'categoría', 'categorías')}</span></span></button>`;
  }).join('');
  main.innerHTML = `
    <section class="hero"><img src="assets/banner.png" alt="Nexus Store: todo para tu computadora, laptop e impresora en un solo lugar"></section>
    <h2 class="titulo-seccion">¿Qué necesitas hoy?</h2>
    <div class="tiles">${tiles}
      <button class="tile todo" data-todo="1"><span class="tile-emoji">🌐</span>
      <span><span class="tile-name">Todo el catálogo</span><span class="tile-count">${plural(PRODUCTS.length, 'producto', 'productos')}</span></span></button>
    </div>`;
}

/* ---- Exploración con filtros ---- */
function facet(titulo, clave, items, activo, totalTxt) {
  const total = items.reduce((s, i) => s + i.n, 0);
  return `<section class="facet"><h2>${titulo}</h2><div class="facet-list">
    <button class="chip ${activo ? '' : 'on'}" data-facet="${clave}" data-valor="">${totalTxt}<span>${total}</span></button>
    ${items.map(i => `<button class="chip ${activo === i.v ? 'on' : ''}" data-facet="${clave}" data-valor="${esc(i.v)}">${i.e ? i.e + ' ' : ''}${esc(i.v)}<span>${i.n}</span></button>`).join('')}
  </div></section>`;
}

function verExploracion(main) {
  const tokens = norm(state.q).split(/\s+/).filter(Boolean);
  const base = PRODUCTS.filter(p => (!state.grupo || p.grupo === state.grupo) && tokens.every(t => p.hay.includes(t)));
  const paraCat = base.filter(p => !state.marca || p.marca === state.marca);
  const paraMarca = base.filter(p => !state.cat || p.categoria === state.cat);
  const res = base.filter(p => (!state.cat || p.categoria === state.cat) && (!state.marca || p.marca === state.marca));

  const grupos = [...contar(base, 'grupo')].map(([v, n]) => ({ v, n, e: emojiGrupo(v) }))
    .sort((a, b) => gruposOrdenados().indexOf(a.v) - gruposOrdenados().indexOf(b.v));
  const cats = [...contar(paraCat, 'categoria')].map(([v, n]) => ({ v, n, e: (paraCat.find(p => p.categoria === v) || {}).emoji }));
  const marcas = [...contar(paraMarca, 'marca')].map(([v, n]) => ({ v, n })).sort((a, b) => a.v.localeCompare(b.v, 'es'));

  const titulo = state.q ? `Resultados para “${esc(state.q)}”` : state.grupo ? `${esc(emojiGrupo(state.grupo))} ${esc(state.grupo)}` : 'Todo el catálogo';
  const migas = `<button data-inicio="1">Inicio</button><span>/</span><span>${state.grupo ? esc(state.grupo) : 'Todo el catálogo'}</span>` +
    (state.cat ? `<span>/</span><span>${esc(state.cat)}</span>` : '') +
    (state.q && state.grupo ? `<span>/</span><button data-global="1">Buscar en todo el catálogo</button>` : '');

  const visibles = res.slice(0, state.mostrados);
  const tarjetas = visibles.map(p => `
    <article class="card">
      <button class="card-img" data-ver="${p.n}" aria-label="Ver ficha técnica de ${esc(p.nombre)}"><img src="${esc(p.img)}" alt="${esc(p.nombre)}" loading="lazy" onerror="this.onerror=null;this.src=PLACEHOLDER"></button>
      <div class="card-body">
        <div class="tags"><span class="tag">${esc(p.emoji)} ${esc(p.categoria)}</span><span class="tag marca">${esc(p.marca)}</span></div>
        <h3>${esc(p.nombre)}</h3>
        <p class="extracto">${esc(extracto(p))}</p>
        <div class="acciones">
          <button class="btn ghost" data-ver="${p.n}">Ver ficha</button>
          <a class="btn wa" href="${esc(waProducto(p))}" target="_blank" rel="noopener">Cotizar</a>
        </div>
      </div>
    </article>`).join('');

  const restantes = res.length - visibles.length;
  const cuerpo = res.length ? `<div class="grid">${tarjetas}</div>` +
      (restantes > 0 ? `<div class="mas"><button class="btn flat" data-mas="1">Mostrar más (${restantes} restantes)</button></div>` : '')
    : `<div class="vacio"><h3>No encontramos productos con esos filtros</h3><p>Quita algún filtro o escríbenos y te ayudamos a encontrarlo.</p>
       <a class="btn wa" href="${esc(CONFIG.WHATSAPP_LINK_GENERAL)}" target="_blank" rel="noopener">${WA_ICON}Consultar por WhatsApp</a></div>`;

  main.innerHTML = `
    <div class="cabecera"><nav class="migas" aria-label="Ruta">${migas}</nav><h1>${titulo}</h1></div>
    <div class="layout">
      <aside class="filtros" aria-label="Filtros">
        ${state.grupo ? '' : facet('Grupo', 'grupo', grupos, state.grupo, 'Todos')}
        ${facet('Categoría', 'cat', cats, state.cat, 'Todas')}
        ${facet('Marca', 'marca', marcas, state.marca, 'Todas')}
        ${(state.cat || state.marca) ? '<button class="btn flat limpiar" data-limpiar="1">Quitar filtros</button>' : ''}
      </aside>
      <section aria-live="polite">
        <div class="resumen"><span>${plural(res.length, 'producto', 'productos')}</span></div>
        ${cuerpo}
      </section>
    </div>`;
}

function render(subir) {
  const main = $('#main');
  if (!state.grupo && !state.todo && !state.q) verPortada(main); else verExploracion(main);
  if (subir) window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---- Ficha técnica ---- */
function abrirFicha(n) {
  const p = PRODUCTS.find(x => x.n === n); if (!p) return;
  const l = lineas(p);
  $('#ficha').innerHTML = `
    <button class="cerrar" id="cerrar" aria-label="Cerrar ficha">×</button>
    <div class="ficha">
      <div class="ficha-img"><img src="${esc(p.img)}" alt="${esc(p.nombre)}" onerror="this.onerror=null;this.src=PLACEHOLDER"></div>
      <div class="ficha-info">
        <div class="tags"><span class="tag">${esc(p.emoji)} ${esc(p.categoria)}</span><span class="tag marca">${esc(p.marca)}</span></div>
        <h2>${esc(p.nombre)}</h2>
        ${l.length ? `<h3>Ficha técnica</h3><ul>${l.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
        <a class="btn wa" href="${esc(waProducto(p))}" target="_blank" rel="noopener">${WA_ICON}Cotizar por WhatsApp</a>
      </div>
    </div>`;
  $('#ficha').showModal();
}

/* ---- Eventos ---- */
function irInicio() { Object.assign(state, { grupo: null, todo: false, todoAuto: false, q: '', cat: null, marca: null, mostrados: CONFIG.PRODUCTOS_POR_PAGINA }); $('#buscar').value = ''; render(true); }

$('#main').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const reset = () => { state.cat = null; state.marca = null; state.mostrados = CONFIG.PRODUCTOS_POR_PAGINA; };
  if (t.dataset.grupo) { state.grupo = t.dataset.grupo; reset(); render(true); }
  else if (t.dataset.todo) { state.todo = true; state.todoAuto = false; reset(); render(true); }
  else if (t.dataset.inicio) irInicio();
  else if (t.dataset.global) { state.grupo = null; state.todo = true; reset(); render(true); }
  else if (t.dataset.ver) abrirFicha(+t.dataset.ver);
  else if (t.dataset.mas) { state.mostrados += CONFIG.PRODUCTOS_POR_PAGINA; render(false); }
  else if (t.dataset.limpiar) { reset(); render(false); }
  else if (t.dataset.facet) {
    const v = t.dataset.valor || null, k = t.dataset.facet;
    if (k === 'grupo') { state.grupo = v; state.todo = true; reset(); }
    else { state[k] = v; state.mostrados = CONFIG.PRODUCTOS_POR_PAGINA; }
    render(false);
  }
});
$('#btn-inicio').addEventListener('click', irInicio);
$('#buscar').addEventListener('input', e => {
  state.q = e.target.value.trim(); state.cat = null; state.marca = null; state.mostrados = CONFIG.PRODUCTOS_POR_PAGINA;
  if (state.q && !state.grupo && !state.todo) { state.todo = true; state.todoAuto = true; }
  if (!state.q && state.todoAuto) { state.todo = false; state.todoAuto = false; }
  render(false);
});
$('#ficha').addEventListener('click', e => { if (e.target.id === 'cerrar' || e.target === $('#ficha')) $('#ficha').close(); });

/* ---- Inicio ---- */
(function datosFijos() {
  $('#tel').textContent = CONFIG.TELEFONO; $('#pie-tel').textContent = CONFIG.TELEFONO;
  [$('#correo'), $('#pie-correo')].forEach(a => { a.textContent = CONFIG.CORREO; a.href = 'mailto:' + CONFIG.CORREO; });
  [$('#wa-cabecera'), $('#wa-flotante')].forEach(a => a.href = CONFIG.WHATSAPP_LINK_GENERAL);
  $('#anio').textContent = new Date().getFullYear();
})();

cargar().then(ok => {
  if (!ok) {
    $('#main').innerHTML = `<div class="estado"><h2>No se pudo cargar el catálogo</h2><p>Recarga la página. Si sigue igual, revisa el enlace CSV en la configuración de index.html.</p></div>`;
    return;
  }
  render(false);
});
</script>
</body>
</html>
